<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C1392" />
      <stop offset="100%" stop-color="#841770" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing ring / data orbit -->
  <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4 2" transform="rotate(-30 32 32)" opacity="0.8" />
  
  <!-- Cricket ball sphere -->
  <circle cx="32" cy="32" r="22" fill="url(#brandGrad)" stroke="#E879F9" stroke-width="1.5" />
  
  <!-- Cricket ball seam -->
  <path d="M 20 14 C 28 22 28 42 20 50" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2 1.5" />
  <path d="M 44 14 C 36 22 36 42 44 50" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2 1.5" />
  
  <!-- Center AI Node and connections -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="20" cy="24" r="2.5" fill="#E879F9" />
  <circle cx="44" cy="40" r="2.5" fill="#C4B5FD" />
  <line x1="20" y1="24" x2="32" y2="32" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
  <line x1="32" y1="32" x2="44" y2="40" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
</svg>